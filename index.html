<!doctype html>
<html lang="vi" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Thieu Nu | Intro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Mo dau nhe cho hanh trinh doc va review sach tren Thieu Nu">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0b16;
            --stroke: rgba(255, 255, 255, 0.08);
            --text: #f6f3ff;
            --muted: #b9b5c9;
            --accent: #f160b1;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 10% 20%, rgba(255, 102, 170, 0.12), transparent 35%),
                        radial-gradient(circle at 80% 0%, rgba(109, 211, 255, 0.2), transparent 32%),
                        var(--bg);
            color: var(--text);
            font-family: "Space Grotesk", "Segoe UI", sans-serif;
            overflow: hidden;
        }
        #loading {
            text-align: center;
            display: grid;
            gap: 14px;
            padding: 24px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--stroke);
            box-shadow: 0 18px 46px rgba(0, 0, 0, 0.35);
        }
        .progress-container {
            width: min(520px, 80vw);
            background: rgba(255, 255, 255, 0.08);
            height: 12px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--stroke);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(135deg, #f160b1, #f48d65);
            border-radius: 20px;
            transition: width 0.6s ease;
        }
        #loading p {
            margin: 0;
            font-size: 17px;
            color: var(--muted);
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p>Welcome to Thiếu Nữ</p>
    </div>
    <script>
    const bar = document.getElementById("progressBar");
    let load = 0;
    const interval = setInterval(() => {
        load += Math.random() * 18;
        if (load >= 100) {
            load = 100;
            clearInterval(interval);
            setTimeout(() => {
                window.location.href = "home.html";
            }, 250);
        }
        if (bar) {
            bar.style.width = load + "%";
        }
    }, 260);
    </script>
</body>
</html>
