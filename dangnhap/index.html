<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Tài Khoản</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="registration-container">
        <h1 class="form-title">ĐĂNG NHẬP</h1> 

        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-user icon"></i>
                <input type="text" id="login-username" placeholder="Tên đăng nhập" required>
            </div>

            <div class="input-group password-group">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="login-password" placeholder="Mật khẩu" required>
                <i class="fas fa-eye eye-icon" id="toggleLoginPassword"></i>
            </div>

            <button type="submit" class="register-button">ĐĂNG NHẬP</button>
        </form>
        
        <p class="login-prompt">
            Chưa có tài khoản? <a href="../dangky/index.html" class="login-link">Đăng ký ngay</a>
        </p>
    </div>

    <script src="script.js"></script> 
</body>
</html>
